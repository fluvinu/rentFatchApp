name: Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Jar
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build -t siddharthshivwanshi/rent:${{ github.sha }} .
          docker tag siddharthshivwanshi/rent:${{ github.sha }} siddharthshivwanshi/rent:latest

      - name: Push Image
        run: |
          docker push siddharthshivwanshi/rent:${{ github.sha }}
          docker push siddharthshivwanshi/rent:latest
